worker_processes 5;
daemon off;

worker_rlimit_nofile 8192;

events {
  worker_connections  4096;  # Default: 1024
}

http {
    include    $!{nginx}/conf/mime.types;
    index    index.html index.htm index.php;

    default_type application/octet-stream;
    log_format   main '$remote_addr - $remote_user [$time_local]  $status '
        '"$request" $body_bytes_sent "$http_referer" '
        '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout;
    error_log /dev/stdout;
    sendfile     on;
    tcp_nopush   on;
    server_names_hash_bucket_size 128; # this seems to be required for some vhosts

    server {
        listen ${PORT};
        listen [::]:${PORT};
        server_name localhost;

        $if(NIXPACKS_PHP_ROOT_DIR) (
            root ${NIXPACKS_PHP_ROOT_DIR};
        ) else (
            root /app;
        )
     
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
     
        index index.php;
     
        charset utf-8;
     
        $if(IS_LARAVEL) (
            location / {
                try_files $uri $uri/ /index.php?$query_string;
            }
        ) else ()
        
        $if(NIXPACKS_PHP_FALLBACK_PATH) (
          location / {
            try_files $uri $uri/ ${NIXPACKS_PHP_FALLBACK_PATH}?$query_string;
          }
        ) else ()
     
        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Agendamento público por link (sem login) — ver
        # Publico/paginas/agendar.php e includes/PublicoTokenService.php.
        # URL bonita: /c/agendar/<slug-token> reescrita internamente pra
        # Publico/paginas/agendar.php?t=<slug-token>. Regra equivalente pra
        # hospedagem Apache em .htaccess (raiz do projeto).
        location ~ ^/c/agendar/([a-z0-9-]+)/?$ {
            rewrite ^/c/agendar/([a-z0-9-]+)/?$ /Publico/paginas/agendar.php?t=$1 last;
        }

        # Link GERAL da barbearia (sem token, /c/agendar ou /c/agendar/) —
        # ver Publico/paginas/escolher_barbeiro.php. Lista os barbeiros
        # cadastrados pra o cliente escolher com quem quer agendar; cada um
        # tem seu próprio link pessoal (regra acima), que continua existindo
        # e funcionando independente desta lista.
        location ~ ^/c/agendar/?$ {
            rewrite ^/c/agendar/?$ /Publico/paginas/escolher_barbeiro.php last;
        }

        # Bloqueia acesso direto às URLs "feias" acima (só as URLs bonitas
        # funcionam) — "internal" faz o nginx recusar qualquer requisição
        # que não seja um redirecionamento interno (como os rewrites acima).
        # Os endpoints em Publico/scripts/*.php NÃO são afetados — continuam
        # acessíveis diretamente, pois são chamados pelo JS do navegador.
        location = /Publico/paginas/agendar.php {
            internal;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include $!{nginx}/conf/fastcgi_params;
            include $!{nginx}/conf/fastcgi.conf;
        }
        location = /Publico/paginas/escolher_barbeiro.php {
            internal;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include $!{nginx}/conf/fastcgi_params;
            include $!{nginx}/conf/fastcgi.conf;
        }

        # URLs curtas das páginas de gestão (login já exigido nelas mesmas —
        # ver includes/guard.php) — piloto: Configurações. Regra equivalente
        # pra hospedagem Apache em .htaccess (raiz do projeto). Diferente do
        # link público acima, a URL "feia" continua funcionando também (sem
        # bloqueio "internal"), já que a página já exige login.
        location ~ ^/configuracoes/?$ {
            rewrite ^/configuracoes/?$ /Configuracoes/paginas/configuracoes.php last;
        }

        $if(IS_LARAVEL) (
            error_page 404 /index.php;
        ) else ()
     
        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include $!{nginx}/conf/fastcgi_params;
            include $!{nginx}/conf/fastcgi.conf;
        }
     
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}